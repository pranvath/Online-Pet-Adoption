<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Pet Adoption System</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            500: '#f97316',
                            600: '#ea580c',
                            900: '#7c2d12',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom styles for animations and smooth transitions */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }
        /* Smooth state transitions */
        .btn-transition {
            transition: all 0.2s ease;
        }
        /* Styling the dynamically added pet cards */
        .pet-card {
            background: white;
            padding: 1.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            border: 1px solid #f3f4f6;
        }
        .pet-card h3 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <!-- Navigation Bar -->
    <nav class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <i class="fa-solid fa-paw text-brand-500 text-2xl mr-2"></i>
                    <span class="font-bold text-xl text-gray-900">ForeverHomes</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8" id="main-content">
        
        <!-- ================= USER VIEW (BROWSE PETS) ================= -->
        <div id="user-view" class="fade-in block">
            
            <!-- Header -->
            <div class="mb-8">
                <h1 class="text-3xl font-bold text-gray-900 mb-2">Find Your New Best Friend</h1>
                <p class="text-gray-600 mb-6">Browse our available pets and give them a forever home.</p>
            </div>

            <!-- Pet Container -->
            <!-- Updated ID from pet-grid to pet-container to match the new JavaScript -->
            <div id="pet-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Pet cards will be injected here by JavaScript -->
            </div>
            
        </div>

    </main>

    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
// Function to fetch pets from the Java backend
async function fetchPets() {
    try {
        // Send a GET request to your Spring Boot API
        const response = await fetch('http://localhost:8080/api/pets');
        
        // Check if the request was successful
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        // Parse the JSON response into a JavaScript array
        const pets = await response.json();
        
        // Call your function to draw the pets on the screen
        renderPets(pets);
        
    } catch (error) {
        console.error("Could not fetch pets from the backend:", error);
        document.getElementById('pet-container').innerHTML = 
            "<p class='text-red-500 col-span-full'>Error loading pets. Is the Java backend running?</p>";
    }
}

// Function to update the HTML (DOM)
function renderPets(petsArray) {
    const container = document.getElementById('pet-container');
    container.innerHTML = ''; // Clear out old data
    
    petsArray.forEach(pet => {
        container.innerHTML += `
            <div class="pet-card">
                <h3>${pet.name} (${pet.type})</h3>
                <p>Age: ${pet.age}</p>
                <p>${pet.description}</p>
                <p>Status: ${pet.adopted ? 'Adopted' : 'Available'}</p>
            </div>
        `;
    });
}

// Automatically fetch pets when the page loads
window.onload = fetchPets;
    </script>
</body>
</html>
